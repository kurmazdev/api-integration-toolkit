name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -c requirements.lock.txt -e '.[test]'
      - name: Backend unit and HTTP integration tests
        run: .venv/bin/pytest -q
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Typecheck and build
        run: |
          npm --prefix frontend run typecheck
          npm --prefix frontend run build
      - name: Install test browser
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Browser end-to-end tests
        env:
          CI: '1'
        run: npm --prefix frontend run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
