[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "api-integration-toolkit"
version = "1.0.0"
description = "Local REST synchronization and failure diagnosis workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.162,<1", "uvicorn>=0.39,<1", "starlette>=1.3.1,<2", "httpx>=0.28,<0.29", "openpyxl>=3.1,<4", "anyio>=4.14.2,<5"]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
